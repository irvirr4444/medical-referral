[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intake-extractor"
version = "0.1.0"
description = "Layout-agnostic referral/intake PDF extraction pipeline"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pdfplumber>=0.11.0",
  "pydantic>=2.6.0",
  "pypdfium2>=4.30.0",
  "python-dotenv>=1.0.0",
  "anthropic>=0.116.0",
  "requests>=2.32.0",
  "tzdata>=2025.1",
  "reportlab>=4.2.0",
  "pillow>=10.0.0",
  "pypdf>=5.0.0",
  "selenium>=4.24.0",
  "selenium-wire>=5.1.0",
  "blinker<1.8",
  "pyOpenSSL<25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"referral_pipeline.synthetic_data" = ["vocabulary_data.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]

