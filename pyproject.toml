[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intake-extractor"
version = "0.1.0"
description = "Layout-agnostic referral/intake PDF extraction pipeline"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pdfplumber>=0.11.0",
  "pydantic>=2.6.0",
  "pypdfium2>=4.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

