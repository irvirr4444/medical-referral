services:
  - type: worker
    name: medical-referral-intake
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src python -m referral_pipeline.worker
    disk:
      name: intake-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: INTAKE_DATA_ROOT
        value: /var/data/intake
      - key: INTAKE_POLL_INTERVAL_SECONDS
        value: "600"
      - key: INTAKE_RETRY_INTERVAL_SECONDS
        value: "300"
      - key: INTAKE_APPROVAL_INTERVAL_SECONDS
        value: "60"
      - key: INTAKE_MAX_MESSAGES
        value: "25"
      - key: INTAKE_MAX_RETRY_JOBS
        value: "10"
      - key: INTAKE_MAX_APPROVAL_MESSAGES
        value: "100"
      - key: INTAKE_DRY_RUN_APPROVALS
        value: "false"
      - key: REFERRAL_REVIEW_STORE
        value: supabase
      - key: INTAKE_MONITOR_ENABLED
        value: "false"
      - key: INTAKE_MONITOR_INTERVAL_SECONDS
        value: "3600"
      - key: INTAKE_MONITOR_SEND_ALERTS
        value: "false"
      - key: INTAKE_LIVE_DRK_ENABLED
        value: "false"
      - key: INTAKE_DRK_MAX_PATIENTS_PER_CYCLE
        value: "10"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OUTLOOK_TENANT_ID
        sync: false
      - key: OUTLOOK_CLIENT_ID
        sync: false
      - key: OUTLOOK_CLIENT_SECRET
        sync: false
      - key: OUTLOOK_MAILBOX
        sync: false
      - key: REVIEW_RECIPIENT_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MONDAY_DOT_COM_API_KEY
        sync: false
      - key: WORKFLOW_DATABASE_BACKEND
        sync: false
      - key: WORKFLOW_NOTIFICATION_RECIPIENTS
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_ALERT_APP_BASE_URL
        sync: false
      - key: GMAIL_ALERT_ROLE_EMAILS
        sync: false
      - key: GMAIL_ALERT_DEFAULT_TO
        sync: false
